name: Build and Release

env:
  MESA_VERSION: 26.1.1

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            output: edonish-auto
          - os: windows-latest
            target: windows-amd64
            output: edonish-auto.exe
          - os: macos-latest
            target: macos-amd64
            output: edonish-auto-mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libglu1-mesa-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      - name: Get version from tag or config
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'Version = ' FyneApp.toml | awk -F'"' '{print $2}')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "Building version: ${{ steps.version.outputs.VERSION }}"
        shell: bash

      - name: Download dependencies
        run: GONOSUMCHECK=* GOFLAGS=-insecure go mod tidy
        shell: bash

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o ${{ matrix.output }} .
        shell: bash

      - name: Bundle Windows portable package with Mesa OpenGL
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mesaArchive = "mesa3d-$env:MESA_VERSION-release-msvc.7z"
          curl.exe -L --retry 3 --output $mesaArchive --url "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/$mesaArchive"
          & 'C:\Program Files\7-Zip\7z.exe' x $mesaArchive -omesa

          New-Item -ItemType Directory -Force -Path windows-portable | Out-Null
          Copy-Item ${{ matrix.output }} windows-portable\
          $mesaDlls = @('opengl32.dll', 'libgallium_wgl.dll')
          foreach ($dll in $mesaDlls) {
            if (Test-Path "mesa\x64\$dll") {
              Copy-Item "mesa\x64\$dll" windows-portable\
              Write-Host "Bundled: $dll"
            } else {
              Write-Host "Warning: $dll not found in Mesa archive, skipping"
            }
          }
          Compress-Archive -Path windows-portable\* -DestinationPath edonish-auto-windows-portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edonish-auto-${{ matrix.target }}
          path: ${{ matrix.output }}

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: edonish-auto-windows-portable
          path: edonish-auto-windows-portable.zip

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Fyne CLI
        run: |
          go install fyne.io/fyne/v2/cmd/fyne@latest
          echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'Version = ' FyneApp.toml | awk -F'"' '{print $2}')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Download dependencies
        run: GONOSUMCHECK=* GOFLAGS=-insecure go mod tidy
        shell: bash

      - name: Build Android APK
        run: |
          set -x
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          
          # Fyne requires gomobile for Android builds
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          
          # Add golang.org/x/mobile to go.mod
          go get golang.org/x/mobile
          go mod tidy
          
          # Build APK using fyne package
          fyne package -os android -appID com.edonish.auto -name edonish-auto -icon Icon.png 2>&1
          
          # Check result - Fyne replaces hyphens with underscores in APK name
          ls -la *.apk 2>/dev/null || echo "No APK found in current dir"
          find . -maxdepth 2 -name "*.apk" 2>/dev/null
          
          APK_FILE=$(find . -maxdepth 2 -name '*.apk' | head -1)
          if [ -n "$APK_FILE" ]; then
            mv "$APK_FILE" edonish-auto-${{ steps.version.outputs.VERSION }}-android.apk
            echo "APK built successfully!"
            ls -la edonish-auto-*.apk
          else
            echo "APK build failed"
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edonish-auto-android-apk
          path: edonish-auto-*.apk
          if-no-files-found: ignore

  package-deb:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: edonish-auto-linux-amd64
          path: build

      - name: Create .deb package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications
          chmod +x build/edonish-auto
          cp build/edonish-auto deb/usr/bin/
          cat > deb/DEBIAN/control << EOF
          Package: edonish-auto
          Version: ${VERSION}
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libgl1, libxcursor1, libxrandr2, libxinerama1, libxi6
          Maintainer: Edonish Auto Team
          Description: eDonish Auto - Automated grade management for edonish.tj
          EOF
          cat > deb/usr/share/applications/edonish-auto.desktop << EOF
          [Desktop Entry]
          Name=eDonish Auto
          Comment=Automated grade management for edonish.tj
          Exec=/usr/bin/edonish-auto
          Icon=edonish-auto
          Terminal=false
          Type=Application
          Categories=Education;
          EOF
          dpkg-deb --build deb edonish-auto_${VERSION}_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: edonish-auto-deb-amd64
          path: edonish-auto_*.deb

  package-rpm:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: edonish-auto-linux-amd64
          path: build

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Create .rpm package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          chmod +x build/edonish-auto
          cp build/edonish-auto rpm/BUILD/
          cat > rpm/SPECS/edonish-auto.spec << 'SPEC'
          Name:           edonish-auto
          Version:        %{version}
          Release:        1%{?dist}
          Summary:        eDonish Auto - Automated grade management
          License:        Proprietary
          Requires:       mesa-libGL libXcursor libXrandr libXinerama libXi
          %description
          Desktop application for automated grade management for edonish.tj
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 755 %{_builddir}/edonish-auto %{buildroot}/usr/bin/edonish-auto
          %files
          /usr/bin/edonish-auto
          SPEC
          rpmbuild --define "_topdir $(pwd)/rpm" --define "_builddir $(pwd)/rpm/BUILD" --define "version ${VERSION}" -bb rpm/SPECS/edonish-auto.spec
          cp rpm/RPMS/*/*.rpm edonish-auto_${VERSION}_x86_64.rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: edonish-auto-rpm-x86_64
          path: edonish-auto_*.rpm

  release:
    runs-on: ubuntu-latest
    needs: [build, package-deb, package-rpm]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List release files
        run: find dist -type f | sort

      - name: Rename files with version suffix
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd dist
          if [ -f edonish-auto-linux-amd64/edonish-auto ]; then
            mv edonish-auto-linux-amd64/edonish-auto edonish-auto-linux-amd64/edonish-auto-${VERSION}-linux-amd64
          fi
          if [ -f edonish-auto-macos-amd64/edonish-auto-mac ]; then
            mv edonish-auto-macos-amd64/edonish-auto-mac edonish-auto-macos-amd64/edonish-auto-${VERSION}-macos-amd64
          fi
          if [ -f edonish-auto-windows-amd64/edonish-auto.exe ]; then
            mv edonish-auto-windows-amd64/edonish-auto.exe edonish-auto-windows-amd64/edonish-auto-${VERSION}-windows-amd64.exe
          fi
          if [ -f edonish-auto-windows-portable/edonish-auto-windows-portable.zip ]; then
            mv edonish-auto-windows-portable/edonish-auto-windows-portable.zip edonish-auto-windows-portable/edonish-auto-${VERSION}-windows-portable.zip
          fi
          echo "Final files:"
          find . -type f | sort

      - name: Create GitHub Release with API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF}
          REPO="${{ github.repository }}"

          HAS_APK="нет"
          if find dist -name "*.apk" | grep -q .; then
            HAS_APK="да"
          fi

          RELEASE_BODY="## eDonish Auto v${VERSION}

          ### Платформы:
          - **Linux**: бинарник (x86_64) + .deb + .rpm
          - **Windows**: .exe + portable.zip (с Mesa OpenGL DLL)
          - **macOS**: бинарник (x86_64)
          - **Android**: .apk (${HAS_APK})

          ### Установка:
          - **Linux (DEB)**: \`sudo dpkg -i edonish-auto_${VERSION}_amd64.deb\`
          - **Linux (RPM)**: \`sudo rpm -i edonish-auto_${VERSION}_x86_64.rpm\`
          - **Windows**: скачайте .exe или portable.zip
          - **macOS**: \`chmod +x edonish-auto-mac && ./edonish-auto-mac\`
          - **Android**: установите .apk на устройство
          "

          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"Release v${VERSION}\",
              \"body\": $(echo "$RELEASE_BODY" | jq -Rs .),
              \"draft\": false,
              \"prerelease\": false
            }" > /tmp/release_response.json

          RELEASE_ID=$(jq -r '.id' /tmp/release_response.json)
          echo "Created release ID: $RELEASE_ID"

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create release"
            cat /tmp/release_response.json
            exit 1
          fi

          UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets"

          find dist -type f | while read file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "$UPLOAD_URL?name=$filename"
            echo ""
          done

          echo "Release created: https://github.com/$REPO/releases/tag/$TAG"
